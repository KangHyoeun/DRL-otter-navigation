# PPO Hyperparameters
algo: "PPO"
batch_size: 2048
lr_actor: 0.00001
lr_critic: 0.00003
gamma: 0.99
eps_clip: 0.2
log_std_init: -0.5
ent_coef_init: 0.01
ent_coef_decay_rate: 0.0
min_ent_coef: 0.001
target_kl: 0.02
hidden_size: 512
seq_len: 8

# Training specifics
training_iterations: 40
train_every_n_episodes: 10
warmup_steps: 10000 # Phase specific overrides can be handled in manager or here
