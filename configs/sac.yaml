# SAC Hyperparameters
algo: "SAC"
batch_size: 256
replay_buffer_capacity: 100000
discount: 0.99
init_temperature: 0.2
alpha_lr: 0.0001
actor_lr: 0.0003
critic_lr: 0.0003
critic_tau: 0.005
actor_update_frequency: 1
critic_target_update_frequency: 2

# Training specifics
train_every_n_steps: 50
training_iterations: 50
warmup_steps: 10000
